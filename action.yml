name: sdk-docker-build-action
description: Builds a Docker image and publishes it to ghcr.io
inputs:
  sdk:
    description: "Short SDK name, like 'rust' or 'analytics-python'. Passed to the Dockerfile as SDK build argument, and included in image name."
    required: true
  ref:
    description: "Blank if this the workflow was triggered by push. Otherwise, git ref to build, like 'main', '3.11.x', '3.11.3', 'refs/changes/58/240858/6', 'refs/pull/37/merge', or full commit hash."
    required: true
  dockerfile:
    description: "Path to Dockerfile, like 'fit-performer/Dockerfile'"
    default: 'Dockerfile'
  fetch-depth:
    description: "Number of commits to fetch. 0 fetches all history and tags, which a build that runs `git describe` needs."
    default: '1'
  version-command:
    description: "Optional shell command, run in the checked-out source, that prints, on one line, the version the SDK reports at runtime. Its output becomes the `com.couchbase.sdk.version` label."
    default: ''
outputs:
  image:
    description: "Fully qualified image name with human-readable version, like: 'ghcr.io/couchbase/rust-fit-performer:1.0.0'"
    value: ${{ steps.report.outputs.image }}
  pinned-image:
    description: "Canonical image reference, like: 'ghcr.io/couchbase/rust-fit-performer@sha256:<sha>'"
    value: ${{ steps.report.outputs.pinned-image }}
runs:
  using: "composite"
  steps:
    - name: Set environment variables
      shell: bash
      run: |
        IMAGE_VERSION=${{ inputs.ref || github.ref_name }}
        if [[ "$IMAGE_VERSION" =~ ^[0-9a-f]{40}$ ]]; then
            # It's a full commit hash. Truncate for friendliness, and prefix with 'sha-' for easy pruning.
            IMAGE_VERSION="sha-${IMAGE_VERSION:0:12}"
        elif [[ "$IMAGE_VERSION" =~ ^v[0-9] ]]; then
            # It looks like a version number tag prefixed with 'v'. Strip the 'v' for consistency between SDKs.
            IMAGE_VERSION="${IMAGE_VERSION#v}"
        elif [[ "$IMAGE_VERSION" = "master" ]]; then
            # Rename "master" to "main" for consistency between SDKs. 
            IMAGE_VERSION="main"
        fi
        echo "IMAGE_VERSION=${IMAGE_VERSION}" >> $GITHUB_ENV
        echo "REGISTRY=ghcr.io" >> $GITHUB_ENV
        echo "IMAGE_NAME=${{ github.repository_owner }}/${{ inputs.sdk }}-fit-performer" >> $GITHUB_ENV

    - name: Plan whether to get source from GitHub or Gerrit
      id: plan
      shell: bash
      run: |
        INPUT_REF="${{ inputs.ref }}"
        if [[ "$INPUT_REF" =~ ^refs/changes/ ]]; then
          echo "source=gerrit" >> $GITHUB_OUTPUT
          GERRIT_SERVER_URL=https://review.couchbase.org
          # Assume Gerrit repo name is same as GitHub repo name (without owner)
          GERRIT_REPO_NAME=${{ github.event.repository.name }}
          echo "image_source_override_for_gerrit=org.opencontainers.image.source=${GERRIT_SERVER_URL}/admin/repos/${GERRIT_REPO_NAME}" >> $GITHUB_OUTPUT
          echo "pr_label_for_gerrit=com.couchbase.pr=${GERRIT_SERVER_URL}/c/${GERRIT_REPO_NAME}/+/${INPUT_REF#${INPUT_REF%/*/*}/}" >> $GITHUB_OUTPUT
          echo "GERRIT_SERVER_URL=$GERRIT_SERVER_URL" >> $GITHUB_ENV
          echo "GERRIT_REPO_NAME=$GERRIT_REPO_NAME" >> $GITHUB_ENV
        else
          echo "source=github" >> $GITHUB_OUTPUT
          if [[ "$INPUT_REF" == refs/pull/* ]]; then
             PR_NUMBER=$(echo "$INPUT_REF" | cut -d'/' -f3)
             echo "pr_label_for_github=com.couchbase.pr=${{ github.server_url }}/${{ github.repository }}/pull/${PR_NUMBER}" >> $GITHUB_OUTPUT
          fi
        fi

    - name: Check out from GitHub
      if: steps.plan.outputs.source == 'github'
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.ref || github.ref }}
        submodules: recursive
        fetch-depth: ${{ inputs.fetch-depth }}

    - name: Check out from Gerrit
      if: steps.plan.outputs.source == 'gerrit'
      shell: bash
      env:
        FETCH_DEPTH: ${{ inputs.fetch-depth }}
      run: |
        DEPTH_ARGS=()
        if [[ "$FETCH_DEPTH" != "0" ]]; then
          DEPTH_ARGS=(--depth "$FETCH_DEPTH")
        fi
        git clone "${DEPTH_ARGS[@]}" --no-checkout ${{env.GERRIT_SERVER_URL}}/${{ env.GERRIT_REPO_NAME }} .
        git fetch "${DEPTH_ARGS[@]}" --recurse-submodules origin ${{ inputs.ref }}
        git checkout FETCH_HEAD
        git log --max-count=1

    - name: Get commit hash
      shell: bash
      run: echo "COMMIT_HASH=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Get SDK version
      id: version
      if: inputs.version-command != ''
      shell: bash
      env:
        VERSION_COMMAND: ${{ inputs.version-command }}
      run: |
        SDK_VERSION=$(bash -euo pipefail -c "$VERSION_COMMAND")
        if [[ -z "$SDK_VERSION" || "$SDK_VERSION" == *$'\n'* ]]; then
          echo "::error::version-command must print exactly one line: $VERSION_COMMAND"
          exit 1
        fi
        echo "SDK version: $SDK_VERSION"
        echo "label=com.couchbase.sdk.version=${SDK_VERSION}" >> $GITHUB_OUTPUT

    - name: Log in to the container registry
      uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Prepare metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=raw,value=${{ env.IMAGE_VERSION }}
        flavor: latest=false
        labels: |
          com.couchbase.github.actions.run=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          org.opencontainers.image.revision=${{ env.COMMIT_HASH }}
          ${{ steps.plan.outputs.image_source_override_for_gerrit }}
          ${{ steps.plan.outputs.pr_label_for_gerrit }}
          ${{ steps.plan.outputs.pr_label_for_github }}
          ${{ steps.version.outputs.label }}

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        build-args: SDK=${{ inputs.sdk }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Report output values
      id: report
      shell: bash
      run: |
        echo "image=${{ steps.meta.outputs.tags }}" >> $GITHUB_OUTPUT
        echo "pinned-image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}" >> $GITHUB_OUTPUT

    - name: Print summary
      shell: bash
      run: |
        echo '🔖 `${{ steps.report.outputs.image }}`' >> $GITHUB_STEP_SUMMARY
        echo '📌 `${{ steps.report.outputs.pinned-image }}`' >> $GITHUB_STEP_SUMMARY
